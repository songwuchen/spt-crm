# SPT-CRM 生产 Nginx（挂到 frontend 容器 /etc/nginx/conf.d/default.conf）
# 对齐 ruolin-rsp：
#   - IP+端口 HTTP 直访（不依赖 Host/域名）
#   - 域名走 HTTPS（证书挂到 /etc/nginx/ssl/）

# HTML / SW 禁止缓存，避免发版后旧 index 指向已删除的 JS chunk
# （表现为：无痕正常，普通窗口 Failed to fetch dynamically imported module）

# ----------------------------------------------------------
# IP + 端口直访：http://192.168.0.39:39280
# ----------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200m;

    # Service Worker 自身绝不能被长期缓存，否则无法推送修复
    location = /sw.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # index.html 显式禁止缓存（避免旧入口指已删 chunk）
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # 带 hash 的构建产物可长期缓存（文件名变即新 URL，与 SW network-first 配合）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # 图片字体等静态资源（非 HTML）
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location /openapi/ {
        proxy_pass http://backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /health {
        proxy_pass http://backend:8002;
    }
}

# ----------------------------------------------------------
# 域名 HTTP → HTTPS（宿主机 39280→80，跳到 39281）
# ----------------------------------------------------------
server {
    listen 80;
    server_name wm.fourier.net.cn link.fourier.net.cn wm-platform.fourier.net.cn;

    location /health {
        proxy_pass http://backend:8002;
    }

    location / {
        return 301 https://$host:39281$request_uri;
    }
}

# ----------------------------------------------------------
# 域名 HTTPS：https://wm.fourier.net.cn:39281 等
# ----------------------------------------------------------
server {
    listen 443 ssl;
    server_name wm.fourier.net.cn link.fourier.net.cn wm-platform.fourier.net.cn;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200m;

    location = /sw.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location /openapi/ {
        proxy_pass http://backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /health {
        proxy_pass http://backend:8002;
    }
}
