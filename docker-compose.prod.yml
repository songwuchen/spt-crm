services:
  db:
    # 与 ruolin-rsp / spt-srm 一致：官方 alpine 镜像。Harbor 转推的 pgvector/redis 在本机易导致 SSH 假死。
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spt_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # 如需对宿主暴露 PG，再打开下一行
    # ports:
    #   - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: wmharbor.fourier.net.cn:39011/songwuchen/spt-crm-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/spt_crm
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  worker:
    image: wmharbor.fourier.net.cn:39011/songwuchen/spt-crm-backend:latest
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbox_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/spt_crm
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  reminder:
    image: wmharbor.fourier.net.cn:39011/songwuchen/spt-crm-backend:latest
    restart: unless-stopped
    command: ["python", "-m", "app.workers.reminder_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/spt_crm
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: wmharbor.fourier.net.cn:39011/songwuchen/spt-crm-frontend:latest
    restart: unless-stopped
    ports:
      # IP+端口直访 HTTP（对齐 ruolin-rsp）
      - "39280:80"
      # 域名 HTTPS
      - "39281:443"
    depends_on:
      - backend
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # 与 ruolin-rsp 相同：挂 live 下 pem（Docker 会解析符号链接为目标文件）
      - /etc/letsencrypt/live/fourier.net.cn/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/fourier.net.cn/privkey.pem:/etc/nginx/ssl/privkey.pem:ro

volumes:
  pgdata:
  uploads:
