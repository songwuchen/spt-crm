<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SPT-CRM 客户关系管理系统 — 客户、线索、商机、报价、合同全流程管理" />
    <meta name="theme-color" content="#1677ff" />
    <title>SPT-CRM</title>
    <script>
      /* 发版后旧缓存 / 错误协议导致 chunk 404 时，自动清 SW·Cache 并重载 */
      (function () {
        var KEY = 'spt_chunk_recover_at';
        var host = location.hostname || '';

        /* 域名必须走 HTTPS（39281）；http://link:39281 会半残加载 */
        try {
          if (location.protocol === 'http:'
              && (host === 'link.fourier.net.cn'
                  || host === 'wm.fourier.net.cn'
                  || host === 'wm-platform.fourier.net.cn')) {
            location.replace('https://' + location.host + location.pathname + location.search + location.hash);
            return;
          }
        } catch (e) {}

        function isChunkErr(msg) {
          msg = String(msg || '');
          return /Failed to fetch dynamically imported module/i.test(msg)
            || /error loading dynamically imported module/i.test(msg)
            || /Loading chunk [\d]+ failed/i.test(msg)
            || /ChunkLoadError/i.test(msg)
            || /Loading CSS chunk/i.test(msg);
        }
        function recover(msg) {
          if (msg && !isChunkErr(msg) && msg.indexOf('script:') !== 0 && msg.indexOf('link:') !== 0) return;
          var last = Number(sessionStorage.getItem(KEY) || 0);
          if (Date.now() - last < 15000) return;
          sessionStorage.setItem(KEY, String(Date.now()));
          var jobs = [];
          try {
            if (navigator.serviceWorker) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all((rs || []).map(function (r) { return r.unregister(); }));
              }));
            }
          } catch (e) {}
          try {
            if (window.caches) {
              jobs.push(caches.keys().then(function (keys) {
                return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
              }));
            }
          } catch (e) {}
          Promise.all(jobs).finally(function () {
            var u = new URL(location.href);
            u.searchParams.set('_nocache', String(Date.now()));
            location.replace(u.toString());
          });
        }
        // PC 域名：主动注销历史 SW，避免继续喂旧 JS
        try {
          if (host !== 'link.fourier.net.cn' && navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              (rs || []).forEach(function (r) { r.unregister(); });
            });
            if (window.caches) {
              caches.keys().then(function (keys) {
                (keys || []).forEach(function (k) { caches.delete(k); });
              });
            }
          }
        } catch (e) {}
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          // 入口 vendor-*.js 404 时 React 起不来，必须在这里拦 script/link 失败
          if (t && t.tagName === 'SCRIPT' && t.src) {
            recover('script:' + t.src);
            return;
          }
          if (t && t.tagName === 'LINK' && t.href && /stylesheet/i.test(t.rel || '')) {
            recover('link:' + t.href);
            return;
          }
          recover((e && (e.message || (e.error && e.error.message))) || '');
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          recover((r && r.message) || r || '');
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
